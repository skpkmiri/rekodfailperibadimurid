    // Main App Component (With Perpetual Offline/Online Synchronization)
    const App = () => {
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('skpk_user');
        return saved ? JSON.parse(saved) : null;
      });

      // Load initial state from LocalStorage fallback if present to ensure offline capability
      const loadLocalFallback = (key, defaultVal) => {
        try {
          const stored = localStorage.getItem('skpk_db_' + key);
          return stored ? JSON.parse(stored) : defaultVal;
        } catch(e) {
          return defaultVal;
        }
      };

      const [users, setUsers] = useState(() => loadLocalFallback('users', DEFAULT_USERS));
      const [classes, setClasses] = useState(() => loadLocalFallback('classes', DEFAULT_CLASSES));
      const [docCategories, setDocCategories] = useState(() => loadLocalFallback('docCategories', DEFAULT_DOC_CATEGORIES));
      const [students, setStudents] = useState(() => loadLocalFallback('students', DEFAULT_STUDENTS));
      const [announcements, setAnnouncements] = useState(() => loadLocalFallback('announcements', DEFAULT_ANNOUNCEMENTS));

      const [activeTab, setActiveTab] = useState('dashboard');
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [isFirebaseConnected, setIsFirebaseConnected] = useState(false);

      useEffect(() => {
        localStorage.setItem('skpk_user', JSON.stringify(currentUser));
      }, [currentUser]);

      // Mirror state changes to local storage continuously
      const updateLocalState = (key, val) => {
        try {
          localStorage.setItem('skpk_db_' + key, JSON.stringify(val));
        } catch(e) {
          console.warn("Storage full or blocked", e);
        }
      };

      // Initialize Firebase Auth & Realtime Firestore Sync
      useEffect(() => {
        let unsubs = [];

        const initCloudSync = async () => {
          if (!window.Firebase) return;
          const { auth, db, appId, signInAnonymously, signInWithCustomToken, onAuthStateChanged, collection, onSnapshot, setDoc, doc } = window.Firebase;

          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (err) {
            console.warn("Auth token fallback to anonymous:", err);
            await signInAnonymously(auth);
          }

          onAuthStateChanged(auth, (user) => {
            if (!user) return;
            setIsFirebaseConnected(true);

            // Firestore Helper for Public Collection Listener with Local Fail-Safe
            const bindCollection = (collName, setFn, seedData) => {
              const collRef = collection(db, 'artifacts', appId, 'public', 'data', collName);
              const unsub = onSnapshot(
                collRef,
                (snapshot) => {
                  if (snapshot.empty && seedData) {
                    seedData.forEach(item => {
                      const idKey = item.id || item.ic;
                      setDoc(doc(db, 'artifacts', appId, 'public', 'data', collName, String(idKey)), item);
                    });
                  } else {
                    const list = [];
                    snapshot.forEach(d => list.push(d.data()));
                    setFn(list);
                    updateLocalState(collName, list);
                  }
                },
                (err) => {
                  console.warn(`Snapshot fallback for ${collName}:`, err);
                  // Gunakan data simpanan tempatan jika awan terputus/tamat tempoh
                  setFn(prev => prev.length > 0 ? prev : seedData);
                }
              );
              unsubs.push(unsub);
            };

            bindCollection('users', setUsers, DEFAULT_USERS);
            bindCollection('classes', setClasses, DEFAULT_CLASSES);
            bindCollection('docCategories', setDocCategories, DEFAULT_DOC_CATEGORIES);
            bindCollection('students', setStudents, DEFAULT_STUDENTS);
            bindCollection('announcements', setAnnouncements, DEFAULT_ANNOUNCEMENTS);
          });
        };

        initCloudSync();

        return () => {
          unsubs.forEach(fn => fn && fn());
        };
      }, []);

      // Data Backup & Export Feature
      const exportDatabase = () => {
        const fullBackup = {
          exportDate: new Date().toISOString(),
          users,
          classes,
          docCategories,
          students,
          announcements
        };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(fullBackup, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `SKPK_MIRI_BACKUP_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      // Data Restore Feature
      const importDatabase = (importedData) => {
        if (importedData.users) { setUsers(importedData.users); updateLocalState('users', importedData.users); }
        if (importedData.classes) { setClasses(importedData.classes); updateLocalState('classes', importedData.classes); }
        if (importedData.docCategories) { setDocCategories(importedData.docCategories); updateLocalState('docCategories', importedData.docCategories); }
        if (importedData.students) { setStudents(importedData.students); updateLocalState('students', importedData.students); }
        if (importedData.announcements) { setAnnouncements(importedData.announcements); updateLocalState('announcements', importedData.announcements); }
      };

      // Cloud Operations with Local Fallback Update
      const saveUserToCloud = (userObj) => {
        setUsers(prev => {
          const updated = [...prev.filter(u => u.ic !== userObj.ic), userObj];
          updateLocalState('users', updated);
          return updated;
        });
        if (!window.Firebase) return;
        const { db, appId, setDoc, doc } = window.Firebase;
        setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', String(userObj.ic)), userObj).catch(console.error);
      };

      const deleteUserFromCloud = (userIc) => {
        setUsers(prev => {
          const updated = prev.filter(u => u.ic !== userIc);
          updateLocalState('users', updated);
          return updated;
        });
        if (!window.Firebase) return;
        const { db, appId, deleteDoc, doc } = window.Firebase;
        deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', String(userIc))).catch(console.error);
      };

      const saveClassToCloud = (classObj) => {
        setClasses(prev => {
          const updated = [...prev.filter(c => c.id !== classObj.id), classObj];
          updateLocalState('classes', updated);
          return updated;
        });
        if (!window.Firebase) return;
        const { db, appId, setDoc, doc } = window.Firebase;
        setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'classes', String(classObj.id)), classObj).catch(console.error);
      };

      const deleteClassFromCloud = (classId) => {
        setClasses(prev => {
          const updated = prev.filter(c => c.id !== classId);
          updateLocalState('classes', updated);
          return updated;
        });
        if (!window.Firebase) return;
        const { db, appId, deleteDoc, doc } = window.Firebase;
        deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'classes', String(classId))).catch(console.error);
      };

      const saveCategoryToCloud = (catObj) => {
        setDocCategories(prev => {
          const updated = [...prev.filter(c => c.id !== catObj.id), catObj];
          updateLocalState('docCategories', updated);
          return updated;
        });
        if (!window.Firebase) return;
        const { db, appId, setDoc, doc } = window.Firebase;
        setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'docCategories', String(catObj.id)), catObj).catch(console.error);
      };

      const deleteCategoryFromCloud = (catId) => {
        setDocCategories(prev => {
          const updated = prev.filter(c => c.id !== catId);
          updateLocalState('docCategories', updated);
          return updated;
        });
        if (!window.Firebase) return;
        const { db, appId, deleteDoc, doc } = window.Firebase;
        deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'docCategories', String(catId))).catch(console.error);
      };

      const saveStudentToCloud = (stdObj) => {
        setStudents(prev => {
          const updated = [...prev.filter(s => s.id !== stdObj.id), stdObj];
          updateLocalState('students', updated);
          return updated;
        });
        if (!window.Firebase) return;
        const { db, appId, setDoc, doc } = window.Firebase;
        setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', String(stdObj.id)), stdObj).catch(console.error);
      };

      const deleteStudentFromCloud = (stdId) => {
        setStudents(prev => {
          const updated = prev.filter(s => s.id !== stdId);
          updateLocalState('students', updated);
          return updated;
        });
        if (!window.Firebase) return;
        const { db, appId, deleteDoc, doc } = window.Firebase;
        deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', String(stdId))).catch(console.error);
      };

      const saveAnnouncementToCloud = (annObj) => {
        setAnnouncements(prev => {
          const updated = [...prev.filter(a => a.id !== annObj.id), annObj];
          updateLocalState('announcements', updated);
          return updated;
        });
        if (!window.Firebase) return;
        const { db, appId, setDoc, doc } = window.Firebase;
        setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'announcements', String(annObj.id)), annObj).catch(console.error);
      };

      const deleteAnnouncementFromCloud = (annId) => {
        setAnnouncements(prev => {
          const updated = prev.filter(a => a.id !== annId);
          updateLocalState('announcements', updated);
          return updated;
        });
        if (!window.Firebase) return;
        const { db, appId, deleteDoc, doc } = window.Firebase;
        deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'announcements', String(annId))).catch(console.error);
      };

      if (!currentUser) {
        return <LoginScreen users={users} onLogin={setCurrentUser} />;
      }

      const activeStudentsCount = students.filter(s => !s.isArchived).length;
      const archivedStudentsCount = students.filter(s => s.isArchived).length;

      const navItems = [
        { id: 'dashboard', label: 'Papan Utama', icon: LayoutDashboard },
        { id: 'students', label: 'Rekod Murid', icon: Users },
        { id: 'archive', label: 'Arkib Murid', icon: Archive },
        { id: 'classes', label: 'Pengurusan Kelas', icon: BookOpen },
        { id: 'teachers', label: 'Kakitangan / Guru', icon: UserCheck },
        { id: 'docSettings', label: 'Tetapan Dokumen', icon: Settings },
      ];

      return (
        <div className="min-h-screen flex flex-col md:flex-row bg-slate-50">
          {/* Mobile Navigation Header */}
          <div className="md:hidden bg-slate-900 text-white p-4 flex justify-between items-center no-print">
            <h1 className="font-extrabold text-sm tracking-wider">SKPK MIRI</h1>
            <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-1">
              {isMobileMenuOpen ? <X className="w-6 h-6"/> : <Menu className="w-6 h-6"/>}
            </button>
          </div>

          {/* Sidebar */}
          <aside className={`no-print w-full md:w-64 bg-slate-900 text-slate-300 flex flex-col justify-between p-4 ${isMobileMenuOpen ? 'block' : 'hidden md:flex'}`}>
            <div>
              <div className="p-3 mb-6 border-b border-slate-800">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center font-black text-white text-xl shadow-lg">
                    SK
                  </div>
                  <div>
                    <h2 className="font-bold text-white text-sm leading-tight">SK PENDIDIKAN KHAS MIRI</h2>
                    <p className="text-[10px] text-indigo-400 font-bold uppercase tracking-widest mt-0.5">SISTEM REKOD FAIL</p>
                  </div>
                </div>

                {/* Cloud Status Indicator */}
                <div className="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-400">
                  <span className="flex items-center gap-1.5 font-medium">
                    <span className={`w-2 h-2 rounded-full ${isFirebaseConnected ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                    {isFirebaseConnected ? 'Firebase Realtime' : 'Mod Tempatan (Offline)'}
                  </span>
                  <CloudCheck className={`w-4 h-4 ${isFirebaseConnected ? 'text-emerald-400' : 'text-amber-400'}`} />
                </div>
              </div>

              <nav className="space-y-1">
                {navItems.map(item => {
                  const Icon = item.icon;
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => { setActiveTab(item.id); setIsMobileMenuOpen(false); }}
                      className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm transition-colors ${isActive ? 'bg-indigo-600 text-white shadow-md shadow-indigo-900/40' : 'hover:bg-slate-800 text-slate-400 hover:text-slate-200'}`}
                    >
                      <Icon className="w-5 h-5" />
                      {item.label}
                    </button>
                  );
                })}
              </nav>
            </div>

            <div className="p-3 border-t border-slate-800 mt-6">
              <div className="mb-3 px-2">
                <p className="text-xs text-slate-400 font-semibold truncate">{currentUser.name}</p>
                <p className="text-[10px] text-indigo-400 uppercase font-bold">{currentUser.role === 'admin' ? 'Pentadbir / Admin' : 'Guru'}</p>
              </div>
              <button
                onClick={() => setCurrentUser(null)}
                className="w-full flex items-center gap-2 px-3 py-2 text-rose-400 hover:bg-rose-500/10 rounded-lg text-sm font-semibold transition-colors"
              >
                <LogOut className="w-4 h-4" /> Log Keluar
              </button>
            </div>
          </aside>

          {/* Main Workspace */}
          <main className="flex-1 p-4 md:p-8 overflow-y-auto">
            {activeTab === 'dashboard' && (
              <Dashboard
                announcements={announcements}
                onSaveAnnouncement={saveAnnouncementToCloud}
                onDeleteAnnouncement={deleteAnnouncementFromCloud}
                currentUser={currentUser}
                stats={{
                  activeStudents: activeStudentsCount,
                  classesCount: classes.length,
                  teachersCount: users.length,
                  archivedCount: archivedStudentsCount
                }}
              />
            )}

            {activeTab === 'students' && (
              <StudentManagement
                students={students}
                onSaveStudent={saveStudentToCloud}
                onDeleteStudent={deleteStudentFromCloud}
                classes={classes}
                docCategories={docCategories}
                currentUser={currentUser}
                isArchiveView={false}
              />
            )}

            {activeTab === 'archive' && (
              <StudentManagement
                students={students}
                onSaveStudent={saveStudentToCloud}
                onDeleteStudent={deleteStudentFromCloud}
                classes={classes}
                docCategories={docCategories}
                currentUser={currentUser}
                isArchiveView={true}
              />
            )}

            {activeTab === 'classes' && (
              <ClassManagement
                classes={classes}
                onSaveClass={saveClassToCloud}
                onDeleteClass={deleteClassFromCloud}
                currentUser={currentUser}
              />
            )}

            {activeTab === 'teachers' && (
              <TeacherManagement
                users={users}
                onSaveUser={saveUserToCloud}
                onDeleteUser={deleteUserFromCloud}
                currentUser={currentUser}
              />
            )}

            {activeTab === 'docSettings' && (
              <DocumentSettings
                categories={docCategories}
                onSaveCategory={saveCategoryToCloud}
                onDeleteCategory={deleteCategoryFromCloud}
                currentUser={currentUser}
                onExportData={exportDatabase}
                onImportData={importDatabase}
              />
            )}
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
